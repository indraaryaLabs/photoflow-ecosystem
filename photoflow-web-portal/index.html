<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Alamat galeri klien MEMUAT kuncinya: /?token=<magic link>. Halaman itu
         memuat setiap thumbnail langsung dari Google, dan tiap permintaan
         gambar membawa header Referer.

         Peramban modern sudah memakai strict-origin-when-cross-origin sebagai
         bawaan, yang hanya mengirim origin ke tujuan lintas-situs. Peramban
         lama memakai no-referrer-when-downgrade, yang mengirim URL LENGKAP —
         dan itu berarti menyerahkan magic link milik klien ke Google pada
         setiap foto yang tampil.

         Disebut eksplisit di sini supaya perlindungannya tidak bergantung pada
         versi peramban yang kebetulan dipakai. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="PhotoFlow — choose your favourite photos and send them to your photographer." />
    <title>PhotoFlow</title>
    <script>
      // Tema ditentukan sebelum halaman digambar pertama kali.
      //
      // Elemen <html> dulu memuat class="dark" tetap. Akibatnya siapa pun yang
      // memakai mode terang melihat kedipan gelap di setiap kali membuka
      // halaman — sampai React selesai dimuat dan membetulkannya.
      //
      // Skrip ini sinkron dan tanpa modul, jadi ia selesai sebelum baris
      // pertama dilukis. Isinya harus tetap sepadan dengan src/lib/theme.js:
      // tidak adanya nilai tersimpan berarti "ikuti sistem".
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          // Mode privat sebagian browser melempar saat localStorage disentuh.
          // Diamkan: React akan menerapkan temanya sesaat lagi.
        }
      })();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
