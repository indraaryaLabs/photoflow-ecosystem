name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Sebagian tes menguji perilaku satu perintah SQL di bawah akses bersamaan —
    # penghitung rate limit dan penguncian galeri. Itu tidak dapat dibuktikan
    # tanpa database yang benar-benar menjalankannya, jadi CI menyediakan
    # PostgreSQL sungguhan alih-alih melewati tes tersebut.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: photoflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: photoflow-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: photoflow-backend/go.mod
          cache-dependency-path: photoflow-backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        # Tanpa TEST_DATABASE_URL, tes yang butuh database melewatkan dirinya
        # sendiri. Variabel ini sengaja terpisah dari DATABASE_URL karena tes
        # tersebut menjalankan DROP TABLE.
        env:
          TEST_DATABASE_URL: host=localhost port=5432 user=postgres password=postgres dbname=photoflow_test sslmode=disable
        # -p 1: satu paket tes dijalankan pada satu waktu.
        #
        # Bawaan `go test` menjalankan paket-paket secara PARALEL, dan di sini
        # ada tiga paket yang membangun ulang skema pada database yang SAMA:
        # handlers menjatuhkan lalu membuat ulang `projects` dan `photos`,
        # cmd/migrate menjalankan AutoMigrate beserta `ALTER TABLE projects DROP
        # COLUMN`, dan middleware membuat `rate_limits`. Dijalankan bersamaan,
        # yang satu menghapus tabel yang sedang dipakai yang lain.
        #
        # Gejalanya tidak menunjuk ke sebabnya sama sekali: `relation "projects"
        # does not exist` pada tes yang jelas-jelas baru membuatnya, berselang
        # dengan `duplicate key value violates unique constraint
        # "pg_type_typname_nsp_index"` — dua pesan yang saling bertentangan,
        # keduanya benar, karena keduanya datang dari proses yang berbeda.
        #
        # Dan karena bergantung pada waktu, ia hanya muncul sesekali. CI yang
        # merah secara acak lebih buruk daripada CI yang lambat: yang pertama
        # mengajari orang mengabaikan hasilnya.
        #
        # Ongkosnya beberapa detik — seluruh suite ini selesai di bawah lima.
        # Alternatifnya satu database per paket, yang menuntut tiap tes tahu
        # namanya sendiri; tidak sepadan untuk repo sebesar ini.
        run: go test ./... -count=1 -p 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: photoflow-web-portal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: photoflow-web-portal/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        # continue-on-error dipasang di sini karena repo memuat delapan
        # pelanggaran lama. Tujuh di antaranya ternyata salah-deteksi: tanpa
        # eslint-plugin-react, no-unused-vars tidak melihat komponen yang hanya
        # dipakai di dalam JSX. Yang kedelapan sungguhan, dan sudah dibetulkan.
        #
        # Sekarang bersih, jadi lint boleh menggagalkan build — kalau tidak,
        # pelanggaran berikutnya akan menumpuk tanpa ada yang menahannya.
        run: npm run lint

      - name: Build
        run: npm run build

  desktop:
    name: Desktop
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: photoflow-desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: photoflow-desktop/requirements-dev.txt

      - name: Install test dependencies
        # requirements.txt yang lengkap butuh eel, Pillow, dan rawpy. Tesnya
        # tidak menyentuh satu pun dari ketiganya, jadi memasangnya hanya
        # memperlambat CI tanpa menguji apa pun.
        run: pip install -r requirements-dev.txt

      - name: Test
        run: python -m unittest discover -s tests -v

  # ── Skema database ────────────────────────────────────────────────────
  #
  # Deploy berjalan otomatis, migrasi tidak. Sekali skema tertinggal dari kode
  # yang sudah live, gejalanya bukan pesan yang jelas melainkan satu tombol yang
  # berhenti bekerja: backend membaca dengan SELECT * sehingga tetap jalan, tapi
  # menulis dengan menyebut kolomnya satu per satu sehingga INSERT ditolak.
  # Persis itu yang terjadi pada projects.submitted_at, dan yang menemukannya
  # adalah pemakainya, bukan CI.
  #
  # Dua job, karena mencegah dan membetulkan bukan pekerjaan yang sama.

  schema-check:
    name: Schema check
    # Hanya pada pull request. Ini pemeriksaan sebelum digabung: kalau perubahan
    # ini menuntut kolom baru, yang membacanya harus tahu SEKARANG.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: photoflow-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: photoflow-backend/go.mod
          cache-dependency-path: photoflow-backend/go.sum

      - name: Check schema against production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Hanya membaca information_schema; tidak menulis apa pun.
        #
        # Sengaja gagal, bukan dilewati diam-diam, ketika secret-nya belum ada.
        # Pemeriksaan yang melewati dirinya sendiri saat tidak dikonfigurasi
        # adalah pemeriksaan yang tidak pernah menemukan apa-apa.
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL belum disetel."
            echo "Tambahkan di Settings > Secrets and variables > Actions."
            echo "Isinya connection string Postgres Supabase (Session pooler)."
            exit 1
          fi
          go run ./cmd/migrate -check

  migrate:
    name: Migrate
    # Hanya saat sudah masuk main. Menerapkan skema dari sebuah pull request
    # akan mengubah database produksi untuk kode yang belum tentu digabung.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Tidak berjalan kalau tesnya merah. Menerapkan skema dari kode yang belum
    # terbukti benar adalah cara memperbesar kerusakan, bukan memperbaikinya.
    needs: [backend]

    # Satu migrasi pada satu waktu, dan yang sedang berjalan tidak dibatalkan.
    # Dua push berdekatan akan menjalankan dua migrasi bersamaan di database
    # yang sama.
    concurrency:
      group: migrate-production
      cancel-in-progress: false

    defaults:
      run:
        working-directory: photoflow-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: photoflow-backend/go.mod
          cache-dependency-path: photoflow-backend/go.sum

      - name: Apply schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL belum disetel."
            echo "Tambahkan di Settings > Secrets and variables > Actions."
            exit 1
          fi
          go run ./cmd/migrate
