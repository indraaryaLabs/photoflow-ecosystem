name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Sebagian tes menguji perilaku satu perintah SQL di bawah akses bersamaan —
    # penghitung rate limit dan penguncian galeri. Itu tidak dapat dibuktikan
    # tanpa database yang benar-benar menjalankannya, jadi CI menyediakan
    # PostgreSQL sungguhan alih-alih melewati tes tersebut.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: photoflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: photoflow-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: photoflow-backend/go.mod
          cache-dependency-path: photoflow-backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        # Tanpa TEST_DATABASE_URL, tes yang butuh database melewatkan dirinya
        # sendiri. Variabel ini sengaja terpisah dari DATABASE_URL karena tes
        # tersebut menjalankan DROP TABLE.
        env:
          TEST_DATABASE_URL: host=localhost port=5432 user=postgres password=postgres dbname=photoflow_test sslmode=disable
        run: go test ./... -count=1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: photoflow-web-portal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: photoflow-web-portal/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        # Repo ini masih memuat pelanggaran lint yang sudah ada sebelum CI
        # dipasang. Lint dijalankan agar hasilnya terlihat, tapi belum
        # menggagalkan build sampai pelanggaran itu dibereskan.
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  desktop:
    name: Desktop
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: photoflow-desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: photoflow-desktop/requirements-dev.txt

      - name: Install test dependencies
        # requirements.txt yang lengkap butuh eel, Pillow, dan rawpy. Tesnya
        # tidak menyentuh satu pun dari ketiganya, jadi memasangnya hanya
        # memperlambat CI tanpa menguji apa pun.
        run: pip install -r requirements-dev.txt

      - name: Test
        run: python -m unittest discover -s tests -v
