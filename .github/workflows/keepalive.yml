name: Keep alive

# Supabase paket gratis menidurkan project yang tidak menerima query selama
# kurang lebih tujuh hari. Yang tidur tidak bangun sendiri: dashboard-nya harus
# ditekan tombol resume secara manual. Untuk aplikasi portofolio, itu kegagalan
# yang paling mahal — yang membukanya adalah orang yang sedang menilai, dan yang
# ia lihat bukan aplikasi melainkan galat koneksi.
#
# Bukti bahwa ini nyata, bukan kekhawatiran teoretis: dari empat project di akun
# ini, tiga sudah berstatus INACTIVE. Yang masih hidup hanya yang dipakai
# sehari-hari.
#
# Satu query terjadwal cukup untuk mereset penghitungnya.

on:
  schedule:
    # Senin dan Kamis, 02:00 UTC (09:00 WIB). Jarak terjauh antar-jalan empat
    # hari, jadi masih ada tiga hari sisa sebelum ambang tujuh hari tercapai
    # meski satu jalan terlewat.
    - cron: '0 2 * * 1,4'
  workflow_dispatch:

# CATATAN: GitHub menonaktifkan workflow terjadwal di repo yang tidak menerima
# commit selama 60 hari. Kalau repo ini menganggur selama itu, workflow ini
# perlu diaktifkan ulang lewat tab Actions.

jobs:
  ping:
    name: Ping database
    runs-on: ubuntu-latest

    # Disalin ke env tingkat job, bukan tingkat step: context `secrets` tidak
    # dapat dibaca dari `if` sebuah step, dan env yang ditulis di dalam step
    # belum terbaca saat `if` step itu sendiri dievaluasi.
    env:
      EXTRA_DATABASE_URLS: ${{ secrets.KEEPALIVE_DATABASE_URLS }}

    defaults:
      run:
        working-directory: photoflow-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: photoflow-backend/go.mod
          cache-dependency-path: photoflow-backend/go.sum

      - name: Ping PhotoFlow database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Memakai perintah yang sudah ada alih-alih psql: kodenya menyambung
        # dengan cara yang persis sama seperti backend, jadi kalau ping ini
        # hijau, yang terbukti bukan cuma database-nya bangun melainkan juga
        # kredensialnya masih sah.
        #
        # -check hanya membaca information_schema. Efek sampingnya diinginkan:
        # kalau skema produksi tertinggal dari kode, alarmnya berbunyi di sini
        # setiap beberapa hari, bukan menunggu ada orang yang menekan tombol
        # yang rusak.
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL belum disetel."
            echo "Tambahkan di Settings > Secrets and variables > Actions."
            exit 1
          fi
          go run ./cmd/migrate -check

      - name: Ping database lain
        # Opsional, dan sengaja terpisah dari langkah di atas.
        #
        # Satu akun Supabase menampung beberapa project portofolio, dan semuanya
        # tertidur dengan aturan yang sama. Daripada menyalin workflow ini ke
        # tiap repo, satu jadwal di sini dapat menyentuh semuanya: isi secret
        # KEEPALIVE_DATABASE_URLS dengan connection string project lain,
        # dipisahkan baris baru.
        #
        # Yang dijalankan hanya SELECT 1 — project lain punya skema sendiri,
        # jadi -check tidak berlaku untuk mereka.
        if: env.EXTRA_DATABASE_URLS != ''
        run: |
          nomor=0
          while IFS= read -r url; do
            url="$(echo "$url" | tr -d '[:space:]')"
            [ -z "$url" ] && continue
            nomor=$((nomor + 1))
            # Connection string tidak pernah dicetak: isinya kata sandi, dan log
            # Actions dapat dibaca siapa pun yang punya akses repo. Nomor urut
            # dipakai supaya tetap jelas yang mana yang gagal.
            if psql "$url" -Atqc 'SELECT 1' >/dev/null 2>&1; then
              echo "✓ database #$nomor menjawab"
            else
              # Peringatan, bukan kegagalan. Database tambahan ada di luar
              # aplikasi ini; satu yang mati tidak boleh menutupi kabar bahwa
              # yang utama hidup.
              echo "::warning::Database #$nomor tidak menjawab."
            fi
          done <<< "$EXTRA_DATABASE_URLS"
